name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build cmake python3-pip
        pip3 install conan
        
    - name: Setup Conan
      run: |
        conan profile detect --force
        
    - name: Install dependencies with Conan
      run: |
        conan install . --output-folder=build --build=missing -s build_type=Release
        
    - name: Configure CMake
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake
        
    - name: Build
      run: cmake --build build
      
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SDL3Wheels-Linux
        path: build/SDL3Wheels
        
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        choco install ninja
        pip install conan
      
    - name: Setup Conan
      run: |
        conan profile detect --force
        
    - name: Install dependencies with Conan
      run: |
        conan install . --output-folder=build --build=missing -s build_type=Release
        
    - name: Configure CMake
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake
      shell: pwsh
        
    - name: Build
      run: cmake --build build
      
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SDL3Wheels-Windows
        path: build/SDL3Wheels.exe
        
  test-qemu:
    runs-on: ubuntu-latest
    needs: build-linux
    permissions:
      contents: read
      actions: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download Linux artifact
      uses: actions/download-artifact@v4
      with:
        name: SDL3Wheels-Linux
        path: ./build
        
    - name: Install QEMU
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-user qemu-user-static
        
    - name: Test with QEMU (dry run)
      run: |
        chmod +x ./build/SDL3Wheels
        # Note: SDL3 requires display, so we just verify the binary can be loaded
        file ./build/SDL3Wheels
        ldd ./build/SDL3Wheels || true
        echo "QEMU test completed (display required for full test)"
